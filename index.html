<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:," />
    <title>Prometeo DataGrip</title>
    <!-- Apply the theme before the stylesheet loads so there is no white flash (same logic as src/state/theme.ts). -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("prometeo.ui.theme") || '"dark"');
          var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <!--
      Same for the UI scale: the CSS zoom of <html> from the stored settings, so the first paint is already at the right size.
      In a browser it stays; in the desktop app src/state/settings.ts removes it once the webview zoom is in place.
      Keep in step with effectiveZoom() in src/state/appearance.ts (src/state/prepaint.test.ts runs both and compares).
    -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("prometeo.ui.settings") || "null") || {};
          var scale = typeof s.uiScale === "number" && isFinite(s.uiScale) ? Math.min(200, Math.max(80, Math.round(s.uiScale / 10) * 10)) : 100;
          var font = s.uiCustomFont === true && typeof s.uiFontSize === "number" && isFinite(s.uiFontSize) ? Math.round((s.uiFontSize / 13) * 100) / 100 : 1;
          var zoom = Math.round((scale / 100) * font * 10000) / 10000;
          if (zoom !== 1) document.documentElement.style.zoom = String(zoom);
        } catch (e) {}
      })();
    </script>
    <style>
      html[data-theme="dark"] { background: #26282c; }
      html[data-theme="light"] { background: #e9eaee; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
