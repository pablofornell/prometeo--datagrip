    <linearGradient id="i5" gradientUnits="userSpaceOnUse" x1="334.6" y1="552.5" x2="369.7" y2="398.5"><stop offset="0" stop-color="#FF8A33"/><stop offset="1" stop-color="#FF5C8A"/></linearGradient>
